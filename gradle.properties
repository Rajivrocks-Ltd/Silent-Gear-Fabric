# Gradle settings
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric properties, check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.19.1

# Dependencies
fabric_api_version=0.155.3+26.1.2
# Forge Config API Port (Fuzs) lets the NeoForge ModConfigSpec code run on Fabric almost unchanged.
forge_config_api_port_version=26.1.5
# Trinkets Updated (Patbox) replaces Curios.
trinkets_version=4.0.1+26.1
# JEI recipe viewer. Silent Gear's plugin compiles against its API; the full mod is a dev runtime mod only.
jei_version=29.47.0.111
# Mod list screen, dev runtime only (Fabric has no built-in mod list).
modmenu_version=18.0.2
# Color mixing library, shipped inside the Silent Lib jar (jar-in-jar).
mixbox_version=2.0.0
# javax.annotation annotations used throughout upstream code (compile only).
jsr305_version=3.0.2

# Shared mod properties
maven_group=net.silentchaos512
# GitHub repository (owner/name, lowercase) whose Packages section the jars are published to.
github_repo=rajivrocks-ltd/silent-gear-fabric

# Silent Lib port. Version follows the upstream release it was ported from.
silentlib_version=11.2.0

# Silent Gear port. Version follows the upstream release it was ported from.
silentgear_version=4.2.3
