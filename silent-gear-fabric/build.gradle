plugins {
	id 'net.fabricmc.fabric-loom'
}

version = project.silentgear_version
group = project.maven_group

base {
	archivesName = "silent-gear-${project.minecraft_version}-fabric"
}

repositories {
	maven {
		// Forge Config API Port
		name = 'Fuzs'
		url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
	}
	maven {
		// Trinkets Updated
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
	maven {
		// JEI
		name = 'BlameJared'
		url = 'https://maven.blamejared.com/'
	}
	maven {
		// Mod Menu
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
}

sourceSets.main.resources {
	// Resources generated by upstream data generators (copied in milestone M3).
	srcDir('src/generated/resources')

	// Development only files that should not ship in the jar.
	exclude("**/*.bbmodel")
	exclude("**/.cache")
}

// Data generation (M10): `.\gradlew.bat :silent-gear-fabric:runDatagen` runs the "fabric-datagen" entrypoint
// (net.silentchaos512.gear.data.DataGenerators) and rewrites src/generated/resources. Client mode, because
// upstream generates models and sounds in the same run. The first run reproduced the copied upstream files
// exactly (2,172 files, same content), so datagen is now the source of those files: change the generators, not
// the JSON. addToResources is off because that folder is already a resource folder (see sourceSets above).
fabricApi {
	configureDataGeneration {
		client = true
		modId = "silentgear"
		outputDirectory = file("src/generated/resources")
		addToResources = false
	}
}

// Automated gametests (dev only, not in the jar). The tests are a small separate mod, "silentgear-gametest",
// that Fabric's gametest server finds through the "fabric-gametest" entrypoint. Run them with
// `.\gradlew.bat :silent-gear-fabric:runGametest`. They are not part of `build`, so a failing test never
// blocks a normal build. Results: build/gametest/junit.xml and build/run/gameTest/logs/latest.log.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	// Class tweaker (26.x name for access wideners), see src/main/resources/silentgear.classtweaker.
	accessWidenerPath = file("src/main/resources/silentgear.classtweaker")

	runs {
		// Fixed offline name for the dev client. Without it the name is random on every launch, so
		// op status and player data would not carry over between test runs.
		client {
			programArgs "--username", "Dev"
		}
		// Give the dev server its own folder, so runServer and runClient can run at the same time.
		server {
			runDir "run-server"
		}
		// Headless gametest server: runs every test once, writes a JUnit report and exits.
		gametest {
			server()
			name = "Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.file('build/gametest/junit.xml')}"
			runDir "build/run/gameTest"
			ideConfigGenerated = false
		}
	}

	// Tell Loom which source sets belong to which mod, so the dev launcher
	// loads Silent Lib from the sibling subproject as a proper mod.
	mods {
		silentgear {
			sourceSet sourceSets.main
		}
		silentlib {
			sourceSet("main", ":silent-lib-fabric")
		}
		"silentgear-gametest" {
			sourceSet sourceSets.gametest
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// javax.annotation (@Nullable, @ParametersAreNonnullByDefault). NeoForge provides these
	// transitively, Fabric does not. Compile only: the JVM ignores missing annotation classes.
	compileOnly "com.google.code.findbugs:jsr305:${project.jsr305_version}"

	implementation project(':silent-lib-fabric')

	implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

	// Soft dependency. Code that touches Trinkets must check FabricLoader.isModLoaded("trinkets") first.
	implementation "eu.pb4:trinkets:${project.trinkets_version}"

	// Dev only: adds the "Mods" button in runClient. Not a dependency of the released mod.
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// JEI: Silent Gear's plugin (compat/jei) compiles against the API. The full mod only runs in dev;
	// players install JEI themselves (it is optional).
	compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

	// Note: upstream also shades mixbox here, but no Silent Gear class uses it directly.
	// Only Silent Lib's ColorUtils does, so mixbox ships inside the Silent Lib jar only.
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	// Show every compile error at once instead of javac's default of 100 (useful while porting).
	it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Maven publication for GitHub Packages (jar, sources, javadoc), see gradle/publishing.gradle.
apply from: rootProject.file('gradle/publishing.gradle')

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_silentgear" }
	}
}
