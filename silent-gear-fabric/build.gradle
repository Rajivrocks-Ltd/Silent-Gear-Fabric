plugins {
	id 'net.fabricmc.fabric-loom'
}

version = project.silentgear_version
group = project.maven_group

base {
	archivesName = "silent-gear-${project.minecraft_version}-fabric"
}

repositories {
	maven {
		// Forge Config API Port
		name = 'Fuzs'
		url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
	}
	maven {
		// Trinkets Updated
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
	maven {
		// Mod Menu
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
}

sourceSets.main.resources {
	// Resources generated by upstream data generators (copied in milestone M3).
	srcDir('src/generated/resources')

	// Development only files that should not ship in the jar.
	exclude("**/*.bbmodel")
	exclude("**/.cache")
}

loom {
	// Tell Loom which source sets belong to which mod, so the dev launcher
	// loads Silent Lib from the sibling subproject as a proper mod.
	mods {
		silentgear {
			sourceSet sourceSets.main
		}
		silentlib {
			sourceSet("main", ":silent-lib-fabric")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// javax.annotation (@Nullable, @ParametersAreNonnullByDefault). NeoForge provides these
	// transitively, Fabric does not. Compile only: the JVM ignores missing annotation classes.
	compileOnly "com.google.code.findbugs:jsr305:${project.jsr305_version}"

	implementation project(':silent-lib-fabric')

	implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

	// Soft dependency. Code that touches Trinkets must check FabricLoader.isModLoaded("trinkets") first.
	implementation "eu.pb4:trinkets:${project.trinkets_version}"

	// Dev only: adds the "Mods" button in runClient. Not a dependency of the released mod.
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Note: upstream also shades mixbox here, but no Silent Gear class uses it directly.
	// Only Silent Lib's ColorUtils does, so mixbox ships inside the Silent Lib jar only.
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_silentgear" }
	}
}
